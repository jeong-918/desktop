<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>샘플 로컬 프로젝트</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f0fdf4;
      color: #166534;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
    }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p { font-size: 14px; color: #4b5563; line-height: 1.5; }
    button {
      margin-top: 16px;
      padding: 10px 20px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 로컬 HTML 실행 성공!</h1>
    <p>바탕화면 런처에서 등록한 상대 경로 <code>./my-project.html</code> 파일이 정상적으로 열렸습니다.</p>
    <button onclick="alert('로컬 HTML 스크립트가 정상 동작합니다!')">클릭 테스트</button>
  </div>
</body>
</html>
