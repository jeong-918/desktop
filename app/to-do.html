
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 일정 & 투두 플래너 (Calendar To-Do)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
    }
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .calendar-day-cell {
      min-height: 44px;
      transition: all 0.15s ease;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-calendar-check text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">스마트 데일리 투두</h1>
          <p class="text-xs text-slate-500">캘린더 기반 범주형 일정 관리</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- 백업 및 복원 -->
        <button onclick="exportData()" title="데이터 JSON 백업" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-download"></i>
          <span class="hidden sm:inline text-xs font-medium">백업</span>
        </button>
        <label for="import-file-input" title="데이터 복원" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition text-sm cursor-pointer flex items-center gap-1.5">
          <i class="fa-solid fa-upload"></i>
          <span class="hidden sm:inline text-xs font-medium">복원</span>
        </label>
        <input type="file" id="import-file-input" class="hidden" accept=".json" onchange="importData(event)">

        <!-- GitHub 서버 동기화 버튼 -->
        <button onclick="loadFromServer()" title="GitHub 저장소 백업(json/todo-backup.json)으로 이 기기 데이터 교체" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          <span class="hidden sm:inline text-xs font-medium">동기화</span>
        </button>

        <div class="h-4 w-px bg-slate-200"></div>

        <!-- 오늘 날짜 바로가기 버튼 -->
        <button onclick="goToToday()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 border border-indigo-200 shadow-xs">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>오늘로 이동</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 미완료 할일 이월(복사) 알림 배너 (과거에 미완료 할일이 있을 시 상단 표시) -->
  <div id="rollover-alert-bar" class="bg-amber-50 border-b border-amber-200 px-4 py-2.5 hidden">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs sm:text-sm text-amber-800">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation text-amber-500 text-base"></i>
        <span>이전 날짜에 완료하지 못한 <strong id="rollover-count">0</strong>개의 할 일이 있습니다. 오늘 일정으로 복사해올까요?</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="carryOverPastTasks()" class="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium shadow-xs transition">오늘로 가져오기</button>
        <button onclick="dismissRolloverAlert()" class="p-1 text-amber-600 hover:text-amber-900 rounded"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  </div>

  <!-- 메인 레이아웃: 좌측 캘린더 & 범주 관리 / 우측 일정 리스트 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- ================= 좌측 사이드바 (캘린더 + 범주 필터) ================= -->
      <div class="lg:col-span-4 space-y-6">
        
        <!-- 미니 캘린더 카드 -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
          <!-- 캘린더 헤더: 년월 & 이동 -->
          <div class="flex items-center justify-between mb-4">
            <h2 id="calendar-month-year" class="text-base font-bold text-slate-800">2026년 9월</h2>
            <div class="flex items-center space-x-1">
              <button onclick="prevMonth()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-800 transition" title="이전달">
                <i class="fa-solid fa-chevron-left text-xs"></i>
              </button>
              <button onclick="nextMonth()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-800 transition" title="다음달">
                <i class="fa-solid fa-chevron-right text-xs"></i>
              </button>
            </div>
          </div>

          <!-- 요일 헤더 -->
          <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
            <div class="text-rose-500">일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div class="text-blue-500">토</div>
          </div>

          <!-- 달력 날짜 그리드 -->
          <div id="calendar-days" class="grid grid-cols-7 gap-1 text-sm">
            <!-- 자바스크립트로 날짜 렌더링 -->
          </div>

          <!-- 캘린더 범례 -->
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-around text-[11px] text-slate-500">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span>100% 완료</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              <span>진행중</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-slate-300"></span>
              <span>미완료</span>
            </div>
          </div>
        </div>

        <!-- 범주(카테고리) 관리 카드 -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-tags text-indigo-500"></i>
              <span>범주 (카테고리)</span>
            </h3>
            <button onclick="openCategoryModal()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-gear text-[11px]"></i> 범주 설정
            </button>
          </div>
          <p class="text-xs text-slate-400 mb-3">범주를 선택하여 특정 영역의 할일만 필터링할 수 있습니다.</p>

          <!-- 범주 필터 버튼 리스트 -->
          <div id="category-filter-list" class="flex flex-wrap gap-1.5">
            <!-- 자바스크립트로 렌더링 -->
          </div>
        </div>

      </div>

      <!-- ================= 우측 메인 컨텐츠 (선택 일자 일정) ================= -->
      <div class="lg:col-span-8 space-y-6">

        <!-- 일자 네비게이션 & 당일 진행률 대시보드 -->
        <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm">
          <!-- 상단 날짜 컨트롤 -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 border-b border-slate-100">
            <div class="flex items-center gap-3">
              <button onclick="changeSelectedDay(-1)" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 transition border border-slate-200 shadow-xs" title="전날">
                <i class="fa-solid fa-chevron-left text-sm"></i>
              </button>
              
              <div>
                <div class="flex items-center gap-2">
                  <h2 id="current-selected-date-str" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    2026년 9월 18일 (금)
                  </h2>
                  <span id="today-badge" class="hidden px-2.5 py-0.5 text-[11px] font-bold bg-indigo-100 text-indigo-700 rounded-full">오늘</span>
                </div>
                <p id="current-selected-relative" class="text-xs text-slate-400 mt-0.5">오늘의 계획을 확인하고 실행하세요</p>
              </div>

              <button onclick="changeSelectedDay(1)" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 transition border border-slate-200 shadow-xs" title="다음날">
                <i class="fa-solid fa-chevron-right text-sm"></i>
              </button>
            </div>

            <!-- 미완료 일괄 익일 복사 버튼 -->
            <button onclick="copyIncompleteToNextDay()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 self-start sm:self-auto border border-slate-200 shadow-xs" title="미완료(시작전/진행중) 항목을 내일로 복사">
              <i class="fa-solid f
